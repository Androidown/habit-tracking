# =============================================================================
# habit-tracking — Nginx Production Configuration
# =============================================================================
# Reverse proxy → Go application on localhost:8080
# HTTPS with Let's Encrypt, HTTP→HTTPS redirect, static caching, security headers
# =============================================================================

# === Upstream ===

upstream habit_tracking_app {
    server 127.0.0.1:8080;
    keepalive 64;
}

# === HTTP → HTTPS Redirect ===

server {
    listen 80;
    listen [::]:80;
    server_name habit-tracker.example.com;

    # Let's Encrypt HTTP-01 challenge — certbot writes to this location
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Everything else redirects to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# === HTTPS Server ===

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name habit-tracker.example.com;

    # ── SSL ──────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/habit-tracker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/habit-tracker.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/habit-tracker.example.com/chain.pem;

    # Modern TLS configuration (Mozilla Intermediate 2024)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Session cache (1 MB ≈ 4 000 sessions)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ── Security Headers ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip Compression ─────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.api+json
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/otf
        font/ttf
        image/bmp
        image/svg+xml
        image/x-icon
        image/vnd.microsoft.icon
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml;

    # ── Logs ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/habit-tracking-access.log combined buffer=512k flush=1m;
    error_log  /var/log/nginx/habit-tracking-error.log warn;

    # ── Root Location — Reverse Proxy to Go App ──────────────────────────
    location / {
        proxy_pass http://habit_tracking_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # Strip the load-balancer header
        proxy_set_header X-Forwarded-Host $server_name;
    }

    # ── Next.js Static Assets (immutable caching) ────────────────────────
    location /_next/static {
        alias /var/www/habit-tracking/_next/static;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Application Assets ────────────────────────────────────────────────
    location /assets {
        alias /var/www/habit-tracking/assets;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Favicon & Robots ─────────────────────────────────────────────────
    location = /favicon.ico {
        alias /var/www/habit-tracking/public/favicon.ico;
        expires 30d;
        access_log off;
    }

    location = /robots.txt {
        alias /var/www/habit-tracking/public/robots.txt;
        access_log off;
    }

    # ── Health Check — no access log ──────────────────────────────────────
    location /health {
        access_log off;
        proxy_pass http://habit_tracking_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
